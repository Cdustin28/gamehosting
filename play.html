<!doctype html>
<html lang="en" data-theme="cardinal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FBF8F2">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Play</title>
  <script>try{var t=localStorage.getItem("cv-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <script src="js/coi-config.js"></script>
  <script src="coi-serviceworker.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="play-page">
  <div class="play-bar">
    <a class="btn ghost" href="library.html" id="back" aria-label="Back to library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span>Library</span>
    </a>
    <span class="game-title" id="game-title">Loading…</span>
    <span class="sync" id="sync" data-state="idle" title="Cloud save status">
      <span class="dot"></span><span class="label" id="sync-label">Not synced yet</span>
    </span>
    <button class="btn ghost perf-toggle" id="perf" type="button" aria-pressed="false" title="Performance mode">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg>
      <span class="label">Performance</span>
    </button>
    <button class="btn primary" id="save-exit" type="button">Save &amp; exit</button>
  </div>

  <div class="stage">
    <div id="game"></div>
    <div class="loading" id="loading">
      <h2 id="loading-title">Getting your game…</h2>
      <div class="progress"><div id="loading-bar"></div></div>
      <span class="muted" id="loading-text"></span>
      <span class="rotate-hint">Turn your phone sideways for a bigger screen.</span>
    </div>
  </div>

  <script type="module" src="js/play.js"></script>
</body>
</html>
