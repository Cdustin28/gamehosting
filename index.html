<!doctype html>
<html lang="en" data-theme="cardinal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF8F2">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in</title>
  <script>try{var t=localStorage.getItem("cv-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="stripe"></div>
    <div class="auth-body">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 30 34" aria-hidden="true">
          <path class="shell" d="M3 0h18l9 9v22a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z"/>
          <rect class="label" x="5" y="7" width="18" height="14" rx="2"/>
          <rect class="ridge" x="6" y="25" width="2" height="6"/><rect class="ridge" x="10" y="25" width="2" height="6"/>
          <rect class="ridge" x="14" y="25" width="2" height="6"/><rect class="ridge" x="18" y="25" width="2" height="6"/>
          <rect class="ridge" x="22" y="25" width="2" height="6"/>
        </svg>
        <span class="brand-name" data-site-name>Cartridge Vault</span>
      </div>
      <p class="tagline">Your games and saves, on any screen.</p>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-signin" aria-selected="true">Sign in</button>
        <button type="button" role="tab" id="tab-request" aria-selected="false">Request account</button>
      </div>

      <div id="message" class="alert" role="status" hidden></div>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          <span class="hint" id="username-hint" hidden>3–20 characters: lowercase letters, numbers, underscores.</span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required minlength="6">
          <span class="hint" id="password-hint" hidden>At least 6 characters.</span>
        </div>
        <div class="field" id="confirm-field" hidden>
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" autocomplete="new-password">
        </div>
        <button class="btn primary block" id="submit" type="submit">Sign in</button>
      </form>
    </div>
    <div class="auth-foot">
      <span>Friends &amp; family only</span>
      <label class="sr-only" for="theme">Theme</label>
      <select id="theme"></select>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
