<!doctype html>
<html lang="en" data-theme="cardinal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF8F2">
  <meta name="robots" content="noindex, nofollow">
  <title>Library</title>
  <script>try{var t=localStorage.getItem("cv-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="library.html">
      <svg class="brand-mark" viewBox="0 0 30 34" aria-hidden="true">
        <path class="shell" d="M3 0h18l9 9v22a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z"/>
        <rect class="label" x="5" y="7" width="18" height="14" rx="2"/>
        <rect class="ridge" x="6" y="25" width="2" height="6"/><rect class="ridge" x="10" y="25" width="2" height="6"/>
        <rect class="ridge" x="14" y="25" width="2" height="6"/><rect class="ridge" x="18" y="25" width="2" height="6"/>
        <rect class="ridge" x="22" y="25" width="2" height="6"/>
      </svg>
      <span class="brand-name" data-site-name>Cartridge Vault</span>
    </a>
    <span class="spacer"></span>
    <label class="sr-only" for="theme">Theme</label>
    <select id="theme" title="Theme"></select>
    <span class="user-chip">
      <span class="name" id="username">…</span>
      <button class="btn ghost" id="sign-out" type="button">Sign out</button>
    </span>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <h1>Library<span class="count" id="count"></span></h1>
      <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games">
      <button class="btn primary" id="add-game" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add game
      </button>
    </div>

    <nav class="filters" id="filters" aria-label="Filter by console"></nav>

    <div id="notice" class="alert" role="status" hidden></div>

    <section class="grid" id="grid" aria-live="polite"></section>

    <div class="empty" id="empty" hidden>
      <h2>No games yet</h2>
      <p>Add a game you own from your computer or phone. It's stored in your private library, along with its saves.</p>
      <button class="btn primary" type="button" data-open-add>Add your first game</button>
    </div>

    <section class="admin" id="admin" hidden>
      <h2>Accounts</h2>
      <p class="muted" id="usage-text"></p>
      <div class="usage-bar"><div id="usage-bar"></div></div>
      <table>
        <thead>
          <tr><th>User</th><th>Status</th><th class="hide-sm">Games</th><th>Storage</th><th></th></tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
    </section>
  </main>

  <!-- Add game -->
  <dialog id="add-dialog">
    <form id="add-form" method="dialog">
      <div class="dialog-head">
        <h2>Add a game</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="dialog-body">
        <div id="add-error" class="alert error" hidden></div>
        <div class="field">
          <label for="rom">Game file</label>
          <input id="rom" type="file" required>
          <span class="hint">.gb .gbc .gba .sfc .smc .z64 .n64 .v64 or .zip — from a cartridge you own.</span>
        </div>
        <div class="row">
          <div class="field">
            <label for="title">Title</label>
            <input id="title" type="text" maxlength="120" required>
          </div>
          <div class="field">
            <label for="system">Console</label>
            <select id="system" required></select>
          </div>
        </div>
        <div class="field">
          <label for="cover">Cover image <span class="muted">(optional)</span></label>
          <input id="cover" type="file" accept="image/*">
          <label class="check"><input id="auto-cover" type="checkbox" checked> Find a cover automatically if none is chosen</label>
        </div>
        <div id="upload-progress" hidden>
          <div class="progress"><div id="progress-bar"></div></div>
          <span class="hint" id="progress-text"></span>
        </div>
      </div>
      <div class="dialog-foot">
        <button class="btn ghost" type="button" data-close>Cancel</button>
        <button class="btn primary" id="add-submit" type="submit">Upload</button>
      </div>
    </form>
  </dialog>

  <!-- Hidden pickers used by the card menu -->
  <input id="cover-picker" type="file" accept="image/*" hidden>
  <input id="save-picker" type="file" hidden>

  <script type="module" src="js/library.js"></script>
</body>
</html>
